name: SDD CI
on:
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node tools/sdd/sdd-validate.mjs --ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run build
